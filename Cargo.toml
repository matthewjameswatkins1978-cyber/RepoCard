[package]
name = "repocard"
version = "0.2.0"
edition = "2021"
description = "Small, fast repository intelligence card"
publish = false

[lib]
name = "repocard"
path = "src/lib.rs"

[[bin]]
name = "repocard"
path = "src/main.rs"

[dependencies]
ignore = "0.4"
tokei = "15"
content_inspector = "0.2"
aho-corasick = "1.1"
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
wait-timeout = "0.2"
# Real Sartorial dependency, pinned to the merged v0.2 commit. No default
# features: RepoCard defines its own CLI surface and only needs presentation
# types, so Sartorial's optional clap integration stays off.
sartorial = { git = "https://github.com/matthewjameswatkins1978-cyber/Sartorial", rev = "2cfbcd16e7c1c90b27310009fddd49101b904331", default-features = false }

[dev-dependencies]
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
