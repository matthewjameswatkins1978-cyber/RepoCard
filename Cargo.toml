[package]
name = "repocard"
version = "0.1.0"
edition = "2021"
description = "Small, fast repository intelligence card"
license = "SEE-LICENSE"

[lib]
name = "repocard"
path = "src/lib.rs"

[[bin]]
name = "repocard"
path = "src/main.rs"

[dependencies]
ignore = "0.4"
tokei = "15"
content_inspector = "0.2"
aho-corasick = "1.1"
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
wait-timeout = "0.2"

[dev-dependencies]
tempfile = "3"
