name: CI

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-targets --all-features
      - name: Dogfood JSON
        shell: bash
        run: cargo run -- . --json > /tmp/repocard.json && python3 -c "import json; d=json.load(open('/tmp/repocard.json')); assert d['schema_version']=='repocard.v0.1'; print('dogfood JSON OK')"
